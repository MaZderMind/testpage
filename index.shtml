<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<title><!--#echo var="host" --></title>
	<link type="text/css" rel="stylesheet" href="style.css">
</head>
<body>
	<!--#if expr="$https = on" -->
		<span class="mark_green"><!--#echo var="ssl_protocol" --> (<!--#echo var="ssl_cipher" --> SNI=<!--#echo var="ssl_server_name" default="" -->) encrypted</span>
	<!--#else -->
		<span class="mark_red">unencrypted</span>
	<!--#endif -->
	<!--#if expr="$ipversion = ipv6" -->
		<span class="mark_green">IPv6</span>
	<!--#else -->
		<span class="mark_red">IPv4</span>
	<!--#endif -->
	request
	<br>
	from
	<span class="mark_blue">
		<a class="mark_blue" href="https://apps.db.ripe.net/db-web-ui/query?searchtext=<!--#echo var="remote_addr" -->"><!--#echo var="remote_addr" --></a>:<!--#echo var="remote_port" -->
	</span>
	<span class="mark_red">(without DNS name)</span>
	<br>
	to 
	<span class="mark_blue">
		<a class="mark_blue" href="https://apps.db.ripe.net/db-web-ui/query?searchtext=<!--#echo var="server_addr" -->"><!--#echo var="server_addr" --></a>:<!--#echo var="server_port" -->
	</span>
	<span class="mark_green"><b> (<!--#echo var="host" -->) </b></span>
	<br>
	at
	<span class="mark_blue"><!--#echo var="date_local" --> (<!--#echo var="date_gmt" -->)</span>
	<br>
	using 
	<span class="mark_blue"><!--#echo var="http_user_agent" default="" --></span>
	<br>
	with 
	<span class="mark_blue"><!--#echo var="server_protocol" --></span>
	using request-method
	<span class="mark_blue"><!--#echo var="request_method" --></span>
	on 
	<span class="mark_blue"><!--#echo var="http_connection" default="" --></span>
	connection 
	<br>
	preferring
	<span class="mark_blue"><!--#echo var="http_accept_language" default="" --></span>
	<br>
	while generally accepting
	<span class="mark_blue"><!--#echo var="http_accept" default="" --></span>
	<br><br><br>
	<span id="forkongithub"><a href="https://github.com/bernd289/testpage">Fork me on GitHub</a></span>
</body>
</html>
